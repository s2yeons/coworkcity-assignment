# 로컬 개발용 PostgreSQL. 실행: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: coworkcity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coworkcity
      POSTGRES_PASSWORD: coworkcity
      POSTGRES_DB: coworkcity
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworkcity -d coworkcity"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db-data:
